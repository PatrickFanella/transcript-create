name: Browser smoke tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'e2e/**'
      - '.nvmrc'
      - '.github/workflows/e2e-tests.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'e2e/**'
      - '.nvmrc'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  chromium:
    name: Seeded Chromium archive smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install browser-test dependencies
        run: npm ci --prefix e2e
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Run seeded archive smoke tests
        run: npm --prefix e2e run test:critical
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  cross-browser:
    name: Nightly ${{ matrix.project }} smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: Mobile Chrome
            browser: chromium
          - project: Mobile Safari
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm ci --prefix e2e
      - name: Install browser
        run: npx --prefix e2e playwright install --with-deps ${{ matrix.browser }}
      - name: Run smoke tests
        working-directory: e2e
        run: npx playwright test tests/archive-smoke.spec.ts --project='${{ matrix.project }}'
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
