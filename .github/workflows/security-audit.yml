name: Security Audit

on:
    push:
        branches: [main, develop]
        paths:
            - "requirements.txt"
            - "requirements-ml-runtime.txt"
            - "constraints.txt"
            - "Dockerfile*"
            - ".dockerignore"
            - "scripts/verify_ml_runtime.py"
            - "scripts/check_security_exceptions.py"
            - "scripts/build-*.sh"
            - "scripts/scan-container-image.sh"
            - ".github/workflows/docker-build*.yml"
            - "app/**/*.py"
            - "worker/**/*.py"
            - ".github/workflows/security-audit.yml"
    pull_request:
        branches: [main, develop]
        paths:
            - "requirements.txt"
            - "requirements-ml-runtime.txt"
            - "constraints.txt"
            - "Dockerfile*"
            - ".dockerignore"
            - "scripts/verify_ml_runtime.py"
            - "scripts/check_security_exceptions.py"
            - "scripts/build-*.sh"
            - "scripts/scan-container-image.sh"
            - ".github/workflows/docker-build*.yml"
            - "app/**/*.py"
            - "worker/**/*.py"
            - ".github/workflows/security-audit.yml"
    schedule:
        # Run weekly on Mondays at 9:00 AM UTC
        - cron: "0 9 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write
    issues: write

jobs:
    dependency-audit:
        name: Audit Python Dependencies
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install pip-audit==2.8.0

            - name: Run blocking pip-audit
              id: pip-audit
              run: |
                  PIP_AUDIT_IGNORE_OUTPUT="$(python scripts/check_security_exceptions.py --pip-audit-args)"
                  read -r -a PIP_AUDIT_IGNORE <<< "$PIP_AUDIT_IGNORE_OUTPUT"
                  set +e
                  pip-audit \
                    --requirement requirements.txt \
                    --no-deps \
                    --disable-pip \
                    --format json \
                    --output pip-audit-requirements.json
                  REQUIREMENTS_STATUS=$?
                  pip-audit \
                    --requirement constraints.txt \
                    --no-deps \
                    --disable-pip \
                    --format json \
                    --output pip-audit-constraints.json
                  CONSTRAINTS_STATUS=$?
                  pip-audit \
                    --requirement requirements-ml-runtime.txt \
                    --no-deps \
                    --disable-pip \
                    "${PIP_AUDIT_IGNORE[@]}" \
                    --format json \
                    --output pip-audit-ml-runtime.json
                  ML_RUNTIME_STATUS=$?
                  set -e

                  if [ "$REQUIREMENTS_STATUS" -ne 0 ] || \
                     [ "$CONSTRAINTS_STATUS" -ne 0 ] || \
                     [ "$ML_RUNTIME_STATUS" -ne 0 ]; then
                    echo "::error::pip-audit found a vulnerability or failed to audit a pinned manifest"
                    exit 1
                  fi

            - name: Upload pip-audit results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: pip-audit-report
                  path: |
                      pip-audit-requirements.json
                      pip-audit-constraints.json
                      pip-audit-ml-runtime.json
                  retention-days: 30

            - name: Enforce ML advisory reachability controls
              run: python scripts/check_security_exceptions.py

    sast-analysis:
        name: SAST - Python Security Analysis
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install bandit
              run: |
                  python -m pip install --upgrade pip
                  pip install 'bandit[sarif]==1.8.0'

            - name: Run bandit security scan
              id: bandit
              run: |
                  echo "## Bandit SAST Report" >> $GITHUB_STEP_SUMMARY
                  
                  # Run bandit and generate SARIF for GitHub Security
                  bandit -r app/ worker/ -lll -ii -f sarif -o bandit-results.sarif
                  
                  # Also run the blocking human-readable gate.
                  bandit -r app/ worker/ -lll -ii -f txt | tee bandit-report.txt
                  
                  # Show summary
                  if [ -f bandit-report.txt ]; then
                    echo '```' >> $GITHUB_STEP_SUMMARY
                    head -50 bandit-report.txt >> $GITHUB_STEP_SUMMARY
                    echo '```' >> $GITHUB_STEP_SUMMARY
                  fi

            - name: Upload bandit SARIF to GitHub Security
              if: always()
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: bandit-results.sarif
                  category: bandit-sast

            - name: Upload bandit report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: bandit-report
                  path: |
                      bandit-results.sarif
                      bandit-report.txt
                  retention-days: 30

    secret-scanning:
        name: Scan for Secrets
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # Full history for gitleaks

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_CONFIG: .gitleaks.toml

    security-summary:
        name: Security Summary
        runs-on: ubuntu-latest
        needs: [dependency-audit, sast-analysis, secret-scanning]
        if: always()
        steps:
            - name: Summary
              run: |
                  echo "## Security Audit Complete" >> $GITHUB_STEP_SUMMARY
                  echo "- Dependency Audit: ${{ needs.dependency-audit.result }}" >> $GITHUB_STEP_SUMMARY
                  echo "- SAST Analysis: ${{ needs.sast-analysis.result }}" >> $GITHUB_STEP_SUMMARY
                  echo "- Secret Scanning: ${{ needs.secret-scanning.result }}" >> $GITHUB_STEP_SUMMARY

                  if [[ "${{ needs.dependency-audit.result }}" == "failure" ]] || [[ "${{ needs.sast-analysis.result }}" == "failure" ]] || [[ "${{ needs.secret-scanning.result }}" == "failure" ]]; then
                    echo "::error::Security checks failed. Please review the audit results."
                    exit 1
                  fi
