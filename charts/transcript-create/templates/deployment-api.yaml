{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "transcript-create.fullname" . }}-api
  labels:
    {{- include "transcript-create.api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "transcript-create.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "transcript-create.api.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "transcript-create.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "transcript-create.podSecurityContext" . | nindent 8 }}
      containers:
      - name: api
        image: {{ include "transcript-create.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transcript-create.fullname" .)) }}
              key: database-url
        - name: REDIS_URL
          value: {{ include "transcript-create.redisUrl" . | quote }}
        - name: OPENSEARCH_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "transcript-create.fullname" . }}-config
              key: opensearch-url
        - name: OPENSEARCH_INDEX_NATIVE
          valueFrom:
            configMapKeyRef:
              name: {{ include "transcript-create.fullname" . }}-config
              key: opensearch-index-native
        - name: OPENSEARCH_INDEX_YOUTUBE
          valueFrom:
            configMapKeyRef:
              name: {{ include "transcript-create.fullname" . }}-config
              key: opensearch-index-youtube
        - name: OPENSEARCH_VERIFY_SSL
          valueFrom:
            configMapKeyRef:
              name: {{ include "transcript-create.fullname" . }}-config
              key: opensearch-verify-ssl
        - name: OPENSEARCH_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transcript-create.fullname" .)) }}
              key: opensearch-user
              optional: true
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transcript-create.fullname" .)) }}
              key: opensearch-password
              optional: true
        - name: WHISPER_MODEL
          value: {{ .Values.config.whisper.model | quote }}
        - name: WHISPER_BACKEND
          value: {{ .Values.config.whisper.backend | quote }}
        - name: SEARCH_BACKEND
          valueFrom:
            configMapKeyRef:
              name: {{ include "transcript-create.fullname" . }}-config
              key: search-backend
        - name: FRONTEND_ORIGIN
          value: {{ .Values.api.frontendOrigin | quote }}
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transcript-create.fullname" .)) }}
              key: session-secret
        - name: ANALYTICS_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transcript-create.fullname" .)) }}
              key: analytics-hmac-secret
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transcript-create.fullname" .)) }}
              key: hf-token
              optional: true
        - name: OAUTH_GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transcript-create.fullname" .)) }}
              key: oauth-google-client-id
              optional: true
        - name: OAUTH_GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transcript-create.fullname" .)) }}
              key: oauth-google-client-secret
              optional: true
        - name: OAUTH_GOOGLE_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: {{ include "transcript-create.fullname" . }}-config
              key: oauth-google-redirect-uri
        - name: OAUTH_TWITCH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transcript-create.fullname" .)) }}
              key: oauth-twitch-client-id
              optional: true
        - name: OAUTH_TWITCH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.existingSecret | default (printf "%s-secrets" (include "transcript-create.fullname" .)) }}
              key: oauth-twitch-client-secret
              optional: true
        - name: OAUTH_TWITCH_REDIRECT_URI
          valueFrom:
            configMapKeyRef:
              name: {{ include "transcript-create.fullname" . }}-config
              key: oauth-twitch-redirect-uri
        - name: BOOTSTRAP_ADMIN_IDENTITIES
          valueFrom:
            configMapKeyRef:
              name: {{ include "transcript-create.fullname" . }}-config
              key: bootstrap-admin-identities
        - name: PRO_PLAN_NAME
          valueFrom:
            configMapKeyRef:
              name: {{ include "transcript-create.fullname" . }}-config
              key: pro-plan-name
        - name: LOG_LEVEL
          value: {{ .Values.config.logging.level | quote }}
        - name: LOG_FORMAT
          value: {{ .Values.config.logging.format | quote }}
        - name: ENVIRONMENT
          value: {{ .Values.global.environment | quote }}
        - name: ENABLE_METRICS
          value: {{ .Values.config.monitoring.enabled | quote }}
        - name: WORKDIR
          value: "/data"
        - name: HF_HOME
          value: "/cache/hf"
        - name: HF_HUB_CACHE
          value: "/cache/hf/hub"
        - name: TRANSFORMERS_CACHE
          value: "/cache/hf/transformers"
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /live
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        volumeMounts:
        - name: data
          mountPath: /data
        - name: cache
          mountPath: /cache
        securityContext:
          {{- include "transcript-create.securityContext" . | nindent 10 }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "transcript-create.fullname" . }}-data
      - name: cache
        persistentVolumeClaim:
          claimName: {{ include "transcript-create.fullname" . }}-cache
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
