networks:
    management:
        name: management
        external: true
    dev:
        name: dev
        external: true

services:
    redis:
        container_name: hasanara-redis
        ports: !override []

    db:
        container_name: hasanara-db
        ports: !override
            - 10.0.0.200:15432:5432
        restart: unless-stopped
        stop_grace_period: 10m

    migrations:
        container_name: hasanara-migrations

    api:
        container_name: hasanara-api
        devices: !override []
        group_add: !override []
        networks:
            - default
            - management
        ports: !override
            - 10.0.0.200:${API_HOST_PORT:-41177}:8000
        environment:
            FRONTEND_ORIGIN: https://hasanara.tv
            CORS_ALLOW_ORIGINS: https://hasanara.tv
            OAUTH_GOOGLE_REDIRECT_URI: ${OAUTH_GOOGLE_REDIRECT_URI:?OAUTH_GOOGLE_REDIRECT_URI is required}
            OAUTH_TWITCH_REDIRECT_URI: ${OAUTH_TWITCH_REDIRECT_URI:?OAUTH_TWITCH_REDIRECT_URI is required}
            BOOTSTRAP_ADMIN_IDENTITIES: ${BOOTSTRAP_ADMIN_IDENTITIES:-}
        restart: unless-stopped

    worker:
        container_name: hasanara-worker
        devices: !override []
        group_add: !override []
        healthcheck:
            disable: true
        ports: !override []
        restart: unless-stopped

    summary-refresher:
        image: hasanara-api:latest
        container_name: hasanara-summary-refresher
        env_file: ${HASANARA_ENV_FILE:-.env}
        environment:
            DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-postgres}@db:5432/transcripts
            ARCHIVE_SUMMARY_REFRESH_SECONDS: ${ARCHIVE_SUMMARY_REFRESH_SECONDS:-900}
            OTEL_SDK_DISABLED: 'true'
            PYTHONPATH: /app
        depends_on:
            db:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
        command:
            - sh
            - -c
            - |
                while true; do
                  if python3 /app/scripts/refresh_archive_summary_stats.py; then
                    date +%s > /tmp/summary-refresher-last-success
                  else
                    echo "archive summary refresh failed" >&2
                  fi
                  sleep "$${ARCHIVE_SUMMARY_REFRESH_SECONDS:-900}"
                done
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - test -f /tmp/summary-refresher-last-success && age=$$(($$(date +%s)-$$(cat /tmp/summary-refresher-last-success))) && max_age=$$(($${ARCHIVE_SUMMARY_REFRESH_SECONDS:-900}*4)) && test "$$age" -lt "$$max_age"
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30m
        ports: !override []

    archive-intelligence-refresher:
        image: hasanara-api:latest
        container_name: hasanara-archive-intelligence-refresher
        env_file: ${HASANARA_ENV_FILE:-.env}
        environment:
            DATABASE_URL: postgresql+psycopg://postgres:${DB_PASSWORD:-postgres}@db:5432/transcripts
            ARCHIVE_INTELLIGENCE_REFRESH_SECONDS: ${ARCHIVE_INTELLIGENCE_REFRESH_SECONDS:-3600}
            OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
            ARCHIVE_SUMMARY_MODEL: ${ARCHIVE_SUMMARY_MODEL:-qwen3:8b}
            OTEL_SDK_DISABLED: 'true'
            PYTHONPATH: /app
        networks:
            - default
            - dev
        depends_on:
            db:
                condition: service_healthy
            migrations:
                condition: service_completed_successfully
        command:
            - sh
            - -c
            - |
                while true; do
                  if python3 /app/scripts/refresh_archive_intelligence.py; then
                    date +%s > /tmp/archive-intelligence-refresher-last-success
                  else
                    echo "archive intelligence refresh failed" >&2
                  fi
                  sleep "$${ARCHIVE_INTELLIGENCE_REFRESH_SECONDS:-3600}"
                done
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - test -f /tmp/archive-intelligence-refresher-last-success && age=$$(($$(date +%s)-$$(cat /tmp/archive-intelligence-refresher-last-success))) && max_age=$$(($${ARCHIVE_INTELLIGENCE_REFRESH_SECONDS:-3600}*4)) && test "$$age" -lt "$$max_age"
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 90m
        ports: !override []

    diarization-worker:
        # Opt-in only: enable with COMPOSE_PROFILES=diarization.
        profiles: [diarization]
        devices: !override []
        group_add: !override []
        environment:
            DIARIZATION_INLINE: 'false'
            DIARIZATION_MAX_DURATION_SECONDS: ${DIARIZATION_MAX_DURATION_SECONDS:-7200}
            DIARIZATION_MAX_JOBS_PER_PROCESS: ${DIARIZATION_MAX_JOBS_PER_PROCESS:-1}
        healthcheck:
            disable: true
        restart: unless-stopped

    backup:
        profiles: !override []
        env_file: ${HASANARA_ENV_FILE:-.env}

    frontend:
        build:
            context: .
            dockerfile: frontend/Dockerfile
        image: hasanara-frontend:latest
        container_name: hasanara-web
        networks:
            - management
        ports:
            - 10.0.0.200:5173:80
        restart: unless-stopped
