name: hasanara-test

services:
  postgres:
    image: postgres:16
    cpus: 0.75
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    environment:
      POSTGRES_DB: hasanara_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${TEST_POSTGRES_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hasanara_test']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    cpus: 0.25
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    ports:
      - '${TEST_REDIS_PORT:-56379}:6379'
    tmpfs:
      - /data
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    cpus: 1.0
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 256
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '${TEST_OPENSEARCH_PORT:-59200}:9200'
    tmpfs:
      - /usr/share/opensearch/data:rw,uid=1000,gid=1000,mode=0750
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:9200/_cluster/health >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
